---
# Reusable post-upgrade verify playbook.
#
# Confirms the host survived whatever mutated it — SSH works, load is
# reasonable, disk has headroom, and no systemd unit has slipped into a
# failed state. Optionally asserts specific services are active and
# specific packages are installed when the caller supplies the vars.
#
# Use from a manifest with:
#
#   verify_playbook: ../verify/post-upgrade.yml
#
# or by importing from your own verify playbook:
#
#   # my-verify.yml
#   - import_playbook: ../../verify/post-upgrade.yml
#   - name: App-specific checks
#     hosts: all
#     tasks: [...]
#
# All the thresholds and lists below are overridable via extra_vars.
- name: Verify host is healthy after upgrade
  hosts: all
  become: false
  gather_facts: false
  vars:
    # Fail the verify if 1-minute load exceeds this.
    load_warn_threshold: 10.0
    # A package upgrade (apt + autoremove) transiently spikes load, and
    # verify runs immediately after. Re-sample the 1-min average a few
    # times so a settling spike doesn't trigger a false rollback of an
    # otherwise-successful upgrade. Total settle budget = retries * delay.
    load_check_retries: 6
    load_check_delay: 10
    # Fail the verify if / is fuller than this percentage.
    disk_warn_threshold_pct: 95
    # Optional list of systemd units that must be 'active'. Empty =
    # skip per-service checks (the failed-units check still runs).
    expected_services: []
    # Optional list of package names that must be installed. Empty =
    # skip the package enumeration entirely.
    expected_packages: []
    # Systemd units whose 'failed' state should be tolerated (e.g. a host
    # with a known-broken chronyd that predates this run). Accepts a real
    # list or a comma-separated string (as passed from the manifest UI).
    # Match is on the full unit name, e.g. 'chronyd.service'.
    ignore_failed_units: []
  tasks:
    - name: SSH round-trip
      ansible.builtin.ping:

    - name: Read 1-minute load average (re-sample until it settles)
      ansible.builtin.shell: awk '{print $1}' /proc/loadavg
      register: loadavg
      changed_when: false
      until: (loadavg.stdout | float) < (load_warn_threshold | float)
      retries: "{{ load_check_retries | int }}"
      delay: "{{ load_check_delay | int }}"
      # Don't error out of the retry loop — let the assert below own the
      # pass/fail decision so its fail_msg is what surfaces to the operator.
      failed_when: false

    - name: Assert load is below threshold
      ansible.builtin.assert:
        that: (loadavg.stdout | float) < (load_warn_threshold | float)
        fail_msg: >-
          1-min load {{ loadavg.stdout }} still exceeds threshold
          {{ load_warn_threshold }} after {{ load_check_retries }} re-samples
          ({{ load_check_retries | int * (load_check_delay | int) }}s settle)

    - name: Read root filesystem usage
      ansible.builtin.command: df -P /
      register: df
      changed_when: false

    - name: Assert root disk has headroom
      ansible.builtin.assert:
        that: >-
          (df.stdout_lines[1].split()[4] | replace('%','') | int)
          < (disk_warn_threshold_pct | int)
        fail_msg: >-
          Root disk usage {{ df.stdout_lines[1].split()[4] }} exceeds
          threshold {{ disk_warn_threshold_pct }}%

    - name: Collect systemd unit states
      ansible.builtin.service_facts:

    - name: Compute failed units not covered by the ignore allowlist
      ansible.builtin.set_fact:
        _ignored_failed_units: >-
          {{ (ignore_failed_units
                if (ignore_failed_units is sequence and ignore_failed_units is not string)
                else ignore_failed_units | string | split(','))
             | map('trim') | reject('equalto', '') | list }}
        _failed_units: >-
          {{ ansible_facts.services.values()
             | selectattr('state', 'defined')
             | selectattr('state', 'equalto', 'failed')
             | map(attribute='name') | list }}

    - name: Determine offending failed units
      ansible.builtin.set_fact:
        _offending_failed_units: >-
          {{ _failed_units | reject('in', _ignored_failed_units) | list }}

    - name: Assert no unexpected systemd unit is in 'failed' state
      ansible.builtin.assert:
        that: _offending_failed_units | length == 0
        fail_msg: >-
          One or more systemd units are failed: {{ _offending_failed_units }}
        success_msg: >-
          No unexpected failed units (tolerated:
          {{ _ignored_failed_units | join(', ') or 'none' }})

    - name: Assert each expected service is active
      ansible.builtin.systemd_service:
        name: "{{ item }}"
      register: svc
      loop: "{{ expected_services }}"
      loop_control:
        label: "{{ item }}"
      failed_when: svc.status.ActiveState != 'active'

    - name: Enumerate installed packages
      ansible.builtin.package_facts:
      when: expected_packages | length > 0

    - name: Assert each expected package is installed
      ansible.builtin.assert:
        that: item in ansible_facts.packages
        fail_msg: "Package '{{ item }}' is not installed"
      loop: "{{ expected_packages }}"
      loop_control:
        label: "{{ item }}"
      when: expected_packages | length > 0
