key: linux-os-upgrade
name: Upgrade OS release
description: >-
  Upgrades to a new major OS release (e.g. Debian 12→13, Ubuntu
  22.04→24.04).
icon: Layers
playbook: playbook.yml
version: "1.0"
estimated_duration: "20–45 min"
destructive: true
supports_group: true
supports_host: true
# Major-release upgrades are long and include a reboot, so they need far
# more headroom than the global ansible.playbook_timeout default — more,
# in fact, than that setting's own 3600s ceiling can express. Effective
# timeout is max(this, the global setting).
playbook_timeout_seconds: 5400
parameters:
  - key: current_version
    label: Current codename
    type: string
    required: true
    help_text: e.g. bookworm (Debian 12) or jammy (Ubuntu 22.04)
  - key: next_version
    label: Target codename
    type: string
    required: true
    help_text: e.g. trixie (Debian 13) or noble (Ubuntu 24.04)
  - key: cleanup
    label: Remove unused packages
    type: bool
    default: true
