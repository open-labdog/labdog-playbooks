---
# k8s-upgrade — group-targeted action.
#
# LabDog runs this playbook **once per group** with a flat inventory:
#
#   all:
#     hosts:
#       node-1: { ansible_host: ..., ... }
#       node-2: { ... }
#       node-3: { ... }
#
# `supports_host: false` in the manifest tells LabDog to dispatch
# group-targeted runs as a single ansible-playbook invocation against
# all members (instead of fanning out per-host). The playbook itself
# discovers control-plane vs worker nodes — no labdog-side roles or
# membership attributes involved.
#
# Parameters arrive as top-level extra-vars; the role's defaults/main.yml
# holds every default. See manifest.yml for what each one does.

- name: Discover cluster topology
  hosts: all
  gather_facts: false
  become: true
  tasks:
    - name: Probe for control-plane manifest
      # The presence of /etc/kubernetes/manifests/kube-apiserver.yaml
      # is the canonical kubeadm-cluster marker for a control-plane
      # node. Workers don't have this file. Probe is read-only.
      ansible.builtin.stat:
        path: /etc/kubernetes/manifests/kube-apiserver.yaml
      register: k8s_cp_manifest

    - name: Group the node by role
      # group_by runs once per host. add_host would not: it bypasses the
      # host loop and runs only for the first host, which classified a
      # single node and left the rest of the cluster out of the run.
      # The surge node gets a group of its own whatever it holds; the
      # validation refuses one that is a control-plane node.
      ansible.builtin.group_by:
        key: >-
          k8s_{{ 'surge' if inventory_hostname == surge_node | default('')
                 else 'control_plane' if k8s_cp_manifest.stat.exists else 'worker' }}
      changed_when: false

    - name: Read the surge node's hardware
      # For the drain capacity check, which counts the surge node before
      # it has joined. Read-only, so it runs in previews too.
      ansible.builtin.setup:
        gather_subset: [min, hardware]
      when: inventory_hostname == surge_node | default('')

    - name: Refuse if no control plane found
      ansible.builtin.assert:
        that: groups['k8s_control_plane'] | default([]) | length > 0
        fail_msg: >-
          No control-plane node detected in this group
          (looked for /etc/kubernetes/manifests/kube-apiserver.yaml).
          Verify the targeted LabDog group contains every node of the
          cluster, including at least one control-plane node.
      run_once: true  # noqa: run-once

    - name: Pick the driver node
      # The alphabetically first control-plane node runs every kubectl
      # call and `kubeadm upgrade apply`. Sorted, because group_by fills
      # groups in task-completion order, which varies between runs. The
      # upgrade plays use `order: sorted`, so the driver goes first.
      ansible.builtin.group_by:
        key: k8s_driver
      changed_when: false
      when: inventory_hostname == groups['k8s_control_plane'] | sort(case_sensitive=true) | first

- name: Validate the cluster before touching any node
  hosts: k8s_driver
  gather_facts: false
  become: true
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  tasks:
    - name: Check membership, hostnames and version skew
      ansible.builtin.import_role:
        name: kubernetes-upgrade
        tasks_from: validate.yml

- name: Upgrade control-plane nodes serially
  hosts: k8s_control_plane
  # The driver (sorted first) must run `kubeadm upgrade apply` before
  # any other control-plane node runs `kubeadm upgrade node`.
  order: sorted
  serial: 1
  # Stop the whole run at the first failed node. Without it a failed
  # control-plane node would still let the worker play start.
  any_errors_fatal: true
  become: true
  gather_facts: true
  vars:
    node_role: control_plane
  roles:
    - role: kubernetes-upgrade

- name: Confirm the control plane is on target before any worker
  hosts: k8s_driver
  gather_facts: false
  become: true
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  tasks:
    - name: Check every control-plane kubelet
      ansible.builtin.import_role:
        name: kubernetes-upgrade
        tasks_from: control-plane-done.yml

- name: Join the surge node at the target version
  # After the control plane, never before: a kubelet must not be newer
  # than the API server, and the surge node joins at the target. Only
  # worker drains get its room; control-plane nodes are drained before
  # it exists. Skipped when no surge_node is set, or no worker needs it.
  hosts: k8s_surge
  any_errors_fatal: true
  become: true
  gather_facts: true
  vars:
    node_role: surge
  tasks:
    - name: Join or reuse the surge node
      ansible.builtin.import_role:
        name: kubernetes-upgrade
        tasks_from: surge-join.yml

- name: Upgrade worker nodes serially
  hosts: k8s_worker
  order: sorted
  serial: 1
  any_errors_fatal: true
  become: true
  gather_facts: true
  vars:
    node_role: worker
  roles:
    - role: kubernetes-upgrade

- name: Drain and remove the surge node
  # Only once every worker is done. A failed run stops before this, so
  # the surge node stays in the cluster carrying the pods it took; a
  # re-run reuses it and removes it here.
  hosts: k8s_surge
  any_errors_fatal: true
  become: true
  gather_facts: false
  tasks:
    - name: Remove the surge node from the cluster
      ansible.builtin.import_role:
        name: kubernetes-upgrade
        tasks_from: surge-remove.yml
