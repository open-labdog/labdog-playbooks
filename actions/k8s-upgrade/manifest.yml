key: k8s-upgrade
name: Upgrade Kubernetes cluster
description: >-
  Drains, upgrades, and re-admits each node in the cluster, one at a
  time. Control plane nodes are upgraded first (kubeadm upgrade
  apply on the first, kubeadm upgrade node on the rest), then workers.
  Moves each node's pkgs.k8s.io apt source to the target minor first,
  takes an etcd snapshot before the control plane moves, and refuses
  up front when a node's pods would not fit on the rest of the cluster
  while it is drained, or when the CoreDNS config uses a plugin kubeadm
  cannot migrate. Optionally joins a spare host as a temporary
  surge node so worker drains have room. Turn on
  "Report only" to preview the plan without touching anything.
  Apt-only for now (Debian / Ubuntu).
icon: Network
playbook: playbook.yml
version: "1.6"
estimated_duration: "5–20 min per node"
destructive: true
supports_group: true
supports_host: false
# The whole cluster runs inside one ansible-playbook invocation, and
# LabDog's global ansible.playbook_timeout defaults to 300 s. Two hours
# covers about six nodes at the 20-minute worst case; the effective
# timeout is max(this, the global setting).
playbook_timeout_seconds: 7200
# Per node: kubelet on target, active, and Ready. A node this run did
# not upgrade passes, so an aborted run never rolls back untouched nodes.
verify_playbook: verify.yml
verify_timeout_seconds: 180
parameters:
  - key: target_version
    label: Target Kubernetes version
    type: string
    required: true
    help_text: >-
      Semver only (e.g. 1.30.4). At most one minor above the running
      control plane. For a new minor, the action moves each node's
      pkgs.k8s.io apt source to it.
  - key: report_only
    label: Report only
    type: bool
    default: false
    help_text: >-
      Check the cluster and list what each node would do, without
      cordoning, installing or restarting anything. LabDog's dry-run
      toggle does the same on LabDog releases that pass --check.
  - key: skip_preflight
    label: Skip preflight checks
    type: bool
    default: false
    help_text: Bypass the per-node sanity checks (kubelet running, target repository readable, packages downloadable). Use sparingly.
  - key: drain_timeout
    label: Drain timeout (seconds)
    type: int
    default: 300
    help_text: Maximum seconds to wait for kubectl drain to evict pods.
  - key: drain_force
    label: Force drain
    type: bool
    default: false
    help_text: >-
      Pass --force to kubectl drain, which deletes pods that no
      controller manages. Those pods are not recreated.
  - key: etcd_backup_dir
    label: etcd backup directory
    type: string
    default: /var/lib/labdog/etcd-backups
    help_text: >-
      Absolute path on the first control-plane node where the
      pre-upgrade etcd snapshot is written. A VM rollback of that node
      erases it, so point this at a mount that lives elsewhere if you can.
  - key: allow_partial_group
    label: Allow nodes outside the group
    type: bool
    default: false
    help_text: >-
      Proceed even when the cluster has nodes that are not in the
      targeted LabDog group. Those nodes are left on their current version.
  - key: skip_capacity_check
    label: Skip the drain capacity check
    type: bool
    default: false
    help_text: >-
      Run even when the check finds that a node's pods would not fit on
      the other nodes while it is drained. The check still runs and
      reports. Use it when you know they fit anyway, for example because
      a request is far above what the pod uses.
  - key: surge_node
    label: Surge node
    type: string
    default: ""
    help_text: >-
      Optional. A host in this LabDog group that is not a cluster node
      yet, but is ready to be one (container runtime, swap off, the
      pkgs.k8s.io repo for the target minor). It joins at the target
      version after the control plane, takes pods while the workers are
      drained, and is drained, reset and removed after the last worker.
  - key: kubeadm_ignore_preflight_errors
    label: Ignore kubeadm preflight errors
    type: string
    default: ""
    help_text: >-
      Optional. kubeadm preflight checks to skip, separated by commas,
      passed as --ignore-preflight-errors to kubeadm upgrade plan, apply
      and node. Set CoreDNSUnsupportedPlugins when the CoreDNS Corefile
      uses a plugin kubeadm cannot migrate (such as template) and you have
      checked it works on the new CoreDNS; kubeadm then leaves that block
      as it is.
