key: k8s-upgrade
name: Upgrade Kubernetes cluster
description: >-
  Drains, upgrades, and re-admits each node in the cluster, one at a
  time. Control plane nodes are upgraded first (kubeadm upgrade
  apply on the first, kubeadm upgrade node on the rest), then workers.
  Takes an etcd snapshot before the control plane moves. Turn on
  "Report only" to preview the plan without touching anything.
  Apt-only for now (Debian / Ubuntu).
icon: Network
playbook: playbook.yml
version: "1.1"
estimated_duration: "5–20 min per node"
destructive: true
supports_group: true
supports_host: false
# The whole cluster runs inside one ansible-playbook invocation, and
# LabDog's global ansible.playbook_timeout defaults to 300 s. Two hours
# covers about six nodes at the 20-minute worst case; the effective
# timeout is max(this, the global setting).
playbook_timeout_seconds: 7200
# Per node: kubelet on target, active, and Ready. A node this run did
# not upgrade passes, so an aborted run never rolls back untouched nodes.
verify_playbook: verify.yml
verify_timeout_seconds: 180
parameters:
  - key: target_version
    label: Target Kubernetes version
    type: string
    required: true
    help_text: >-
      Semver only (e.g. 1.30.4). At most one minor above the running
      control plane. Must already be downloadable from the apt repo
      configured on every node.
  - key: report_only
    label: Report only
    type: bool
    default: false
    help_text: >-
      Check the cluster and list what each node would do, without
      cordoning, installing or restarting anything. Use this rather than
      LabDog's dry-run toggle, which does not reach the playbook.
  - key: skip_preflight
    label: Skip preflight checks
    type: bool
    default: false
    help_text: Bypass the per-node sanity checks (kubelet running, packages downloadable). Use sparingly.
  - key: drain_timeout
    label: Drain timeout (seconds)
    type: int
    default: 300
    help_text: Maximum seconds to wait for kubectl drain to evict pods.
  - key: drain_force
    label: Force drain
    type: bool
    default: false
    help_text: >-
      Pass --force to kubectl drain, which deletes pods that no
      controller manages. Those pods are not recreated.
  - key: etcd_backup_dir
    label: etcd backup directory
    type: string
    default: /var/lib/labdog/etcd-backups
    help_text: >-
      Absolute path on the first control-plane node where the
      pre-upgrade etcd snapshot is written. A VM rollback of that node
      erases it, so point this at a mount that lives elsewhere if you can.
  - key: allow_partial_group
    label: Allow nodes outside the group
    type: bool
    default: false
    help_text: >-
      Proceed even when the cluster has nodes that are not in the
      targeted LabDog group. Those nodes are left on their current version.
