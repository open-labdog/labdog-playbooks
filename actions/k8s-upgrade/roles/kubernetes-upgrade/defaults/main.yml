---
# Wire from manifest parameters via --extra-vars. Extra-vars win over
# these, so every manifest parameter needs a default here.
target_version: ""
report_only: false
skip_preflight: false
drain_timeout: 300
drain_force: false
etcd_backup_dir: /var/lib/labdog/etcd-backups
allow_partial_group: false
skip_capacity_check: false
surge_node: ""
kubeadm_ignore_preflight_errors: ""

# kubeadm preflight checks to skip, as kubeadm's own flag. Passed to
# upgrade plan, upgrade apply and upgrade node alike.
k8s_kubeadm_extra_args: >-
  {{ ['--ignore-preflight-errors=' ~ (kubeadm_ignore_preflight_errors | regex_replace('\s', ''))]
     if kubeadm_ignore_preflight_errors | trim else [] }}

# Plugins kubeadm's CoreDNS migration knows how to carry across a CoreDNS
# version change (the coredns/corefile-migration tool it embeds). Any
# other plugin in the Corefile makes `kubeadm upgrade plan` and `apply`
# fail their CoreDNSUnsupportedPlugins preflight check, so validate.yml
# looks for one up front.
k8s_coredns_migratable_plugins:
  - errors
  - log
  - health
  - ready
  - autopath
  - kubernetes
  - k8s_external
  - prometheus
  - forward
  - proxy
  - cache
  - loop
  - reload
  - loadbalance
  - hosts
  - rewrite
  - transfer

# Preview mode: report_only, or a real `ansible-playbook --check` (what
# LabDog's dry run passes since labdog#264). In both, the role runs every
# read-only check, prints the plan, and changes nothing. Under --check
# the mutating commands would be skipped anyway, but later steps read
# their output and fail with a misleading error, so the role stops
# before them instead. An `ansible_check_mode` extra-var (LabDog before
# #264) is overridden by ansible-core, so it does not trigger this.
k8s_preview: "{{ report_only | bool or ansible_check_mode | default(false) | bool }}"

# The node every kubectl call runs on: the alphabetically first
# control-plane node, picked by the discovery play. Its admin.conf is
# the only kubeconfig the action needs.
k8s_driver: "{{ groups['k8s_driver'] | first }}"
k8s_kubeconfig: /etc/kubernetes/admin.conf

# How often a failed drain is retried, and the pause between tries. See
# drain.yml: a drain that hit its own timeout is not retried.
k8s_drain_retries: 4
k8s_drain_retry_delay: 20

# Set on a node before the action cordons it, removed when the action
# uncordons it. A node the operator cordoned by hand never gets it, so
# the action never uncordons a node it did not cordon. A re-run finishes
# any node that is on target but still carries it.
k8s_cordon_annotation: labdog.io/k8s-upgrade-cordoned

# Set on the surge node as soon as it has joined, removed with the node.
# The action only ever reuses or removes a node that carries it, so a
# surge_node that names a real cluster member is refused, never reset.
k8s_surge_annotation: labdog.io/k8s-upgrade-surge

# What the validation decided for the surge node, read by the surge
# plays from the driver's facts: "none" (no surge node, or no worker
# needs it), "join" (not in the cluster yet) or "reuse" (an earlier run
# left it joined).
k8s_surge_state: "{{ hostvars[k8s_driver]['_k8s_surge_state'] | default('none') }}"

# Kubernetes ships one apt repository per minor version at pkgs.k8s.io.
# For a minor upgrade the role moves each node's existing source to the
# target minor and refreshes its signing key, right before that node is
# upgraded (tasks/repo-switch.yml). It never adds a repository a node
# does not have.
kube_packages:
  - kubeadm
  - kubelet
  - kubectl

# The deb is named like "1.30.4-1.1"; allow any Debian revision.
kube_apt_version_suffix: "*"

# The pkgs.k8s.io path inside an apt source line, with the minor as
# group 1. Matched anywhere in the line, so a mirror URL that keeps the
# path (http://cache:3142/pkgs.k8s.io/core:/stable:/v1.30/deb/) counts.
k8s_repo_path_regex: 'pkgs\.k8s\.io/core:/stable:/v([0-9]+\.[0-9]+)/deb'
