---
# Wire from manifest parameters via --extra-vars. Extra-vars win over
# these, so every manifest parameter needs a default here.
target_version: ""
report_only: false
skip_preflight: false
drain_timeout: 300
drain_force: false
etcd_backup_dir: /var/lib/labdog/etcd-backups
allow_partial_group: false

# Preview mode: report_only, or a real `ansible-playbook --check` (what
# LabDog's dry run passes since labdog#264). In both, the role runs every
# read-only check, prints the plan, and changes nothing. Under --check
# the mutating commands would be skipped anyway, but later steps read
# their output and fail with a misleading error, so the role stops
# before them instead. An `ansible_check_mode` extra-var (LabDog before
# #264) is overridden by ansible-core, so it does not trigger this.
k8s_preview: "{{ report_only | bool or ansible_check_mode | default(false) | bool }}"

# The node every kubectl call runs on: the alphabetically first
# control-plane node, picked by the discovery play. Its admin.conf is
# the only kubeconfig the action needs.
k8s_driver: "{{ groups['k8s_driver'] | first }}"
k8s_kubeconfig: /etc/kubernetes/admin.conf

# Set on a node before the action cordons it, removed when the action
# uncordons it. A node the operator cordoned by hand never gets it, so
# the action never uncordons a node it did not cordon. A re-run finishes
# any node that is on target but still carries it.
k8s_cordon_annotation: labdog.io/k8s-upgrade-cordoned

# Apt package state. Kubernetes ships per-minor-version repositories at
# pkgs.k8s.io; the operator is expected to have the matching repo
# configured (e.g. ``deb https://pkgs.k8s.io/core:/stable:/v1.30/deb/ /``)
# before triggering this action. We never reconfigure repos here —
# that's a bootstrap concern, not an upgrade one.
kube_packages:
  - kubeadm
  - kubelet
  - kubectl

# The deb is named like "1.30.4-1.1"; allow any Debian revision.
kube_apt_version_suffix: "*"
