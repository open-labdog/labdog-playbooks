---
# Drains run from the first control-plane node — that's where the
# operator's ``admin.conf`` lives and where kubectl works without extra
# kubeconfig plumbing. ``become: true`` because admin.conf is
# root-owned.

- name: Record that this run cordons the node — {{ inventory_hostname }}
  # Skipped for a node the operator had already cordoned, so the action
  # leaves that node cordoned when it is done.
  ansible.builtin.command:
    argv:
      - kubectl
      - annotate
      - node
      - "{{ inventory_hostname }}"
      - "{{ k8s_cordon_annotation }}=true"
      - --overwrite
  delegate_to: "{{ k8s_driver }}"
  environment:
    KUBECONFIG: "{{ k8s_kubeconfig }}"
  changed_when: true
  when: not _k8s_was_unschedulable

- name: Remember the annotation
  ansible.builtin.set_fact:
    _k8s_cordoned_by_us: true
  when: not _k8s_was_unschedulable

- name: Cordon node — {{ inventory_hostname }}
  ansible.builtin.command:
    argv: [kubectl, cordon, "{{ inventory_hostname }}"]
  delegate_to: "{{ k8s_driver }}"
  environment:
    KUBECONFIG: "{{ k8s_kubeconfig }}"
  changed_when: true

- name: Drain node — {{ inventory_hostname }}
  # ``--ignore-daemonsets`` is required (DaemonSet pods can't be
  # evicted). ``--delete-emptydir-data`` keeps drain from stalling on
  # ephemeral state — the canonical kubeadm playbook does the same.
  # ``--force`` only when the operator asked for it: it deletes pods no
  # controller will recreate.
  #
  # A drain that fails for any reason but its own timeout is retried: an
  # eviction can fail on a transient API error, such as an eviction
  # webhook whose pod this same drain just moved (Mimir's rollout
  # operator, "failed calling webhook ... EOF"). kubectl drain gives up
  # on those at once; only PodDisruptionBudget refusals are retried
  # inside it. A re-run picks up where the last one stopped. A timeout
  # is not retried, since every attempt would wait drain_timeout again.
  ansible.builtin.command:
    argv: >-
      {{ ['kubectl', 'drain', inventory_hostname,
          '--ignore-daemonsets', '--delete-emptydir-data',
          '--timeout=' ~ (drain_timeout | int) ~ 's']
         + (['--force'] if drain_force | bool else []) }}
  delegate_to: "{{ k8s_driver }}"
  environment:
    KUBECONFIG: "{{ k8s_kubeconfig }}"
  register: _k8s_drain
  until: >-
    _k8s_drain.rc == 0
    or 'global timeout reached' in (_k8s_drain.stderr | default(''))
  retries: "{{ k8s_drain_retries | int }}"
  delay: "{{ k8s_drain_retry_delay | int }}"
  failed_when: _k8s_drain.rc != 0
  changed_when: true
