---
# Per-node sanity checks. The play-level validation covers cluster-wide
# invariants once on the driver; this file runs per node and verifies
# the node itself is upgradeable. Read-only, so it runs in preview mode.
# The apt source and package checks live in apt-prepare.yml.

- name: Verify kubelet is running
  ansible.builtin.systemd_service:
    name: kubelet
  register: _k8s_kubelet_unit
  failed_when: _k8s_kubelet_unit.status.ActiveState | default('inactive') != 'active'
  # The surge node has no kubelet running before it joins.
  when: node_role | default('') != 'surge'
