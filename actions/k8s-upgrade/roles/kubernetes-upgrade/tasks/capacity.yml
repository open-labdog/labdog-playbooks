---
# Would every node's pods fit on the rest of the cluster while that node
# is drained? Run once on the driver before any node is cordoned, so a
# cluster without the headroom is refused up front instead of a drain
# hanging until drain_timeout with the node already cordoned. Read-only,
# so it also runs in preview mode. files/drain_capacity.py does the work
# and lists what it does not model (pod anti-affinity, topology spread,
# PodDisruptionBudgets, volume topology). With a surge node the worker
# drains count it too, estimated from its hardware if it has not joined.

- name: Simulate each drain against the rest of the cluster
  vars:
    _surge_facts: "{{ hostvars[surge_node]['ansible_facts'] | default({}) if surge_node else {} }}"
    _arch_labels: {x86_64: amd64, aarch64: arm64, armv7l: arm, ppc64le: ppc64le, s390x: s390x}
    _surge_args: >-
      {{ [] if _k8s_surge_state == 'none'
         else ['--surge', surge_node]
              + (['--surge-cpu', _surge_facts['processor_vcpus'] | string,
                  '--surge-memory', (_surge_facts['memtotal_mb'] | string) ~ 'Mi',
                  '--surge-arch', _arch_labels[_surge_facts['architecture']] | default('')]
                 if _k8s_surge_state == 'join' else [])
              + (_k8s_to_drain | select('in', groups['k8s_control_plane'])
                 | map('regex_replace', '^', '--before-surge=') | list) }}
  ansible.builtin.script:
    cmd: "drain_capacity.py {{ (_surge_args + _k8s_to_drain) | map('quote') | join(' ') }}"
    executable: python3
  register: _k8s_capacity_probe
  changed_when: false
  check_mode: false
  when: _k8s_to_drain | length > 0

- name: Report the drain capacity
  ansible.builtin.debug:
    msg: "{{ (_k8s_capacity_probe.stdout | from_json).lines }}"
  when: _k8s_to_drain | length > 0

- name: Every drain fits on the rest of the cluster
  ansible.builtin.assert:
    that: (_k8s_capacity_probe.stdout | from_json).fits
    fail_msg: >-
      Not enough room on the rest of the cluster to drain
      {{ (_k8s_capacity_probe.stdout | from_json).short | join(', ') }}:
      the pods listed above would stay Pending, and kubectl drain would
      wait out drain_timeout with the node cordoned. Free up capacity,
      name a surge node (or a bigger one), or lower the pods' requests. If you know they fit
      anyway (pod anti-affinity or a request the check reads wrongly),
      turn on "Skip the drain capacity check".
    quiet: true
  when:
    - _k8s_to_drain | length > 0
    - not skip_capacity_check | bool
