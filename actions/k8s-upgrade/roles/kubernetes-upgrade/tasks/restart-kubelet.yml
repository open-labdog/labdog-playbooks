---
# Restart unconditionally: ``kubeadm upgrade`` rewrites the kubelet
# config even when the package itself did not change, and the upstream
# procedure always restarts. A direct task rather than a handler, since
# handlers can't be flushed conditionally inside the role's block.

- name: Reload systemd and restart kubelet
  ansible.builtin.systemd_service:
    name: kubelet
    state: restarted
    daemon_reload: true

- name: Wait for kubelet to be active again
  ansible.builtin.systemd_service:
    name: kubelet
  register: _k8s_kubelet_after
  until: _k8s_kubelet_after.status.ActiveState | default('inactive') == 'active'
  retries: 30
  delay: 2
