---
# Adds the per-service configs (Docker) to the staging directory built by
# role-alloy-linux-configure, or takes this pack's copy out of it when the
# service is gone. Writes nothing live: role-alloy-linux-apply installs
# what validates. _alloy_detected comes from role-alloy-linux-detect.

- name: Assert the staging directory is available
  ansible.builtin.assert:
    that:
      - _alloy_template_dir is defined
      - _alloy_stage is defined
    fail_msg: >-
      role-alloy-linux-configure must run before role-alloy-linux-services in
      the same play.

- name: Decide which service configs this host gets
  ansible.builtin.set_fact:
    _alloy_services_wanted: >-
      {{ _alloy_services_wanted | default({}) | combine({
           item.key: (lookup('vars', 'alloy_force_' + item.key, default=none) | bool)
                     if lookup('vars', 'alloy_force_' + item.key, default=none) is not none
                     else ((_alloy_detected | default({}))[item.key] | default(false) | bool)
         }) }}
  loop: "{{ alloy_service_map | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

# Reading the Docker socket needs root. Recorded here, applied by
# role-alloy-linux-apply as a systemd drop-in.
- name: Decide whether Alloy runs as root, and which pack files go
  ansible.builtin.set_fact:
    _alloy_run_as_root: "{{ _alloy_services_wanted.docker | default(false) }}"
    _alloy_unwanted_files: >-
      {{ alloy_service_map | dict2items
         | selectattr('key', 'in', _alloy_services_wanted | dict2items | rejectattr('value') | map(attribute='key') | list)
         | map(attribute='value.config_file') | list }}

- name: Render wanted service configs into staging
  ansible.builtin.template:
    src: "{{ _alloy_template_dir }}/{{ item.value.template }}"
    dest: "{{ _alloy_stage }}/{{ alloy_config_prefix }}{{ item.value.config_file }}"
    mode: "0600"
  loop: "{{ alloy_service_map | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: _alloy_services_wanted[item.key]
  changed_when: false  # staging only
  check_mode: false

# Only this pack's own copy can be here under that name: preflight refuses
# a run that would replace someone else's.
- name: Take configs for absent services out of staging
  ansible.builtin.file:
    path: "{{ _alloy_stage }}/{{ alloy_config_prefix }}{{ item.value.config_file }}"
    state: absent
  loop: "{{ alloy_service_map | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: not _alloy_services_wanted[item.key]
  changed_when: false  # staging only
  check_mode: false
