---
alloy_confd_dir: /etc/alloy/conf.d
# Filename prefix for labdog's own config files; overridden at runtime by
# role-alloy-linux-state when adopting an operator-owned config directory.
alloy_config_prefix: ""
alloy_user: alloy
alloy_group: alloy

# Per-service force override (null = auto-detect, true = force enable, false = force disable)
alloy_force_docker: null

# Service map — must match the definition used in role-alloy-detect.
# Basic monitoring only: Docker is the sole auto-detected service.
alloy_service_map:
  docker:
    systemd_names:
      - docker.service
    port: null
    template: docker.alloy.j2
    config_file: docker.alloy
