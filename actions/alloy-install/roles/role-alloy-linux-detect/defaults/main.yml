---
# Detection method: "service", "port", or "any"
alloy_detection_method: "service"

# Service map — drives detection and config deployment. This pack does
# basic monitoring only; Docker is the sole auto-detected service. Install
# anything more advanced (database exporters, etc.) yourself.
alloy_service_map:
  docker:
    systemd_names:
      - docker.service
    port: null
    template: docker.alloy.j2
    config_file: docker.alloy
