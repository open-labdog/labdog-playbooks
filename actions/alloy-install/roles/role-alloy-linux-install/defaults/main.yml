---
# Config-only mode — skip installation, only deploy config files
alloy_config_only: false

# Set true to remove a locally installed (dpkg -i) Alloy before installing
# from the Grafana APT repository.
alloy_replace_local_install: false

# Configuration directory — used when pre-writing /etc/default/alloy before
# the package install so the package does not overwrite it with defaults.
alloy_confd_dir: /etc/alloy/conf.d
