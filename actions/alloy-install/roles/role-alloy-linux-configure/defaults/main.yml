---
# Endpoint URLs
alloy_prometheus_url: "http://prometheus:9090/api/v1/write"
alloy_loki_url: "http://loki:3100/loki/api/v1/push"

# Mimir tenant ID sent as X-Scope-OrgID header (required when multitenancy_enabled: true)
alloy_mimir_org_id: "anonymous"

# LabDog identity labels stamped on every shipped series (external_labels)
# so LabDog can query a host's metrics back on its host page. LabDog injects
# these at dispatch: labdog_host_id = the DB host id, labdog_hostname = the
# host's name. Empty host id when Alloy is installed outside LabDog —
# Prometheus drops empty label values, so nothing is added.
labdog_host_id: ""
labdog_hostname: "{{ inventory_hostname }}"

# Skip TLS certificate verification for Prometheus and Loki endpoints
alloy_tls_insecure_skip_verify: false

# File ownership
alloy_user: alloy
alloy_group: alloy

# Configuration directory
alloy_confd_dir: /etc/alloy/conf.d

# File log paths — list of glob patterns for file-based log collection
alloy_file_log_paths:
  - "/var/log/{syslog,messages,*.log}"

# Group-based config directory. Templates in
# <alloy_group_configs_dir>/<group_name>/*.alloy.j2 are deployed to hosts
# that belong to <group_name> in the LabDog inventory. The special "all/"
# subdirectory is deployed to every host the action runs against.
alloy_group_configs_dir: "{{ playbook_dir }}/group_configs"
