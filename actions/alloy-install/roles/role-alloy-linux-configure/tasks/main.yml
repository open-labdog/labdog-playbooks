---
- name: Resolve template source to bundled templates
  ansible.builtin.set_fact:
    _alloy_template_dir: "{{ role_path }}/templates"
  tags:
    - configure

- name: Create configuration directory
  ansible.builtin.file:
    path: "{{ alloy_confd_dir }}"
    state: directory
    owner: "{{ alloy_user }}"
    group: "{{ alloy_group }}"
    mode: "0755"
  tags:
    - configure

- name: Deploy base configuration files
  ansible.builtin.include_tasks: base_configs.yml
  tags:
    - configure

- name: Deploy group-based configuration files
  ansible.builtin.include_tasks: group_configs.yml
  tags:
    - configure
    - group_configs
