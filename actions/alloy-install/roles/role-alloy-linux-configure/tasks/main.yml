---
# Builds the config Alloy would load after this run, in a staging
# directory: a copy of every file it loads today, with this pack's files
# rendered over their own earlier versions. role-alloy-linux-validate
# checks the staging copy as a whole before role-alloy-linux-apply touches
# the live directory, so a file this pack doesn't manage that clashes with
# the new config (say, one still referencing loki.write.default) stops the
# run with the live config and the running Alloy untouched.
#
# Staging is scratch space, not the host's config, so it is built for real
# in check mode too: a dry run validates the same config a real run would.

- name: Resolve template source to bundled templates
  ansible.builtin.set_fact:
    _alloy_template_dir: "{{ role_path }}/templates"

- name: Create the staging directory
  ansible.builtin.tempfile:
    state: directory
    prefix: labdog-alloy-stage.
  register: _alloy_stage_dir
  changed_when: false  # scratch space, not the host's config
  check_mode: false

- name: Record the staging directory
  ansible.builtin.set_fact:
    _alloy_stage: "{{ _alloy_stage_dir.path }}"

- name: Copy the files Alloy loads today into staging
  ansible.builtin.copy:
    src: "{{ item.value }}"
    dest: "{{ _alloy_stage }}/{{ item.key | basename }}"
    remote_src: true
    mode: "0600"
  loop: "{{ _alloy_live_files | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  changed_when: false
  check_mode: false

- name: Render this pack's base configs into staging
  ansible.builtin.template:
    src: "{{ _alloy_template_dir }}/{{ item }}.j2"
    dest: "{{ _alloy_stage }}/{{ alloy_config_prefix }}{{ item }}"
    mode: "0600"
  loop:
    - endpoints.alloy
    - alloy.alloy
    - linux_node_metrics.alloy
    - linux_journal_logs.alloy
    - linux_file_logs.alloy
  changed_when: false
  check_mode: false
