key: alloy-install
name: Install Alloy agent
description: >-
  Installs and configures Grafana Alloy on Debian/Ubuntu hosts for basic
  monitoring: node metrics to Prometheus/Mimir and journal + file logs to
  Loki, with optional Docker auto-detection. Adopts an Alloy that is already
  installed: drops labdog's configs (namespaced) into an existing config
  directory and reloads, or switches a single-file install to a directory and
  restarts. Idempotent — re-running converges; set "Config only" to refresh
  config without touching the package.
icon: Activity
playbook: playbook.yml
version: "1.0"
estimated_duration: "1–3 min"
destructive: true
supports_group: true
supports_host: true

# Tie into LabDog's Grafana integration: LabDog fills these playbook vars
# from its registered default Grafana instance at dispatch (so the operator
# doesn't re-type URLs), and always injects labdog_host_id / labdog_hostname
# so the shipped metrics are queryable back on the host page. Operator-
# supplied values still win over the injected URLs.
metrics_backend:
  prometheus_push_var: alloy_prometheus_url
  loki_push_var: alloy_loki_url
  org_id_var: alloy_mimir_org_id

parameters:
  - key: alloy_prometheus_url
    label: Prometheus/Mimir Write URL
    type: string
    required: true
    help_text: Select a registered Mimir destination (configure under Integrations → Grafana).
  - key: alloy_loki_url
    label: Loki Write URL
    type: string
    required: true
    help_text: Select a registered Loki destination (configure under Integrations → Grafana).
  - key: alloy_config_only
    label: Config only (skip install)
    type: bool
    default: false
    help_text: Skip package install and only refresh /etc/alloy/conf.d/. Useful for config-only re-runs.
  - key: alloy_detect_services
    label: Auto-detect Docker
    type: bool
    default: true
    help_text: Detect a running Docker daemon and deploy its container metrics + log scrape config.

# After a successful run, register the package + service so labdog
# manages them going forward (drift checks notice them, Host detail
# tabs reflect them, future syncs keep them in their declared state).
# Skipped silently if the operator has already declared either row
# for the host (operator intent wins).
post_run_register:
  packages:
    - package_name: alloy
      state: present
  services:
    - service_name: alloy.service
      state: running
      enabled: true
