key: alloy-install
name: Install Alloy agent
description: >-
  Installs and configures Grafana Alloy on Debian/Ubuntu hosts. Ships
  metrics to Prometheus and logs to Loki, with optional auto-detection
  of common services (Docker, MySQL, PostgreSQL) and group-based config
  layering. Idempotent — re-running converges; set "Config only" to
  refresh config without touching the package.
icon: Activity
playbook: playbook.yml
version: "1.0"
estimated_duration: "1–3 min"
destructive: true
supports_group: true
supports_host: true

parameters:
  - key: alloy_prometheus_url
    label: Prometheus remote-write URL
    type: string
    required: true
    help_text: Full URL including /api/v1/write — e.g. http://prometheus:9090/api/v1/write
  - key: alloy_loki_url
    label: Loki push URL
    type: string
    required: true
    help_text: Full URL including /loki/api/v1/push — e.g. http://loki:3100/loki/api/v1/push
  - key: alloy_install_method
    label: Install method
    type: choice
    choices: ["repo", "local"]
    default: "repo"
    help_text: "'repo' = apt from grafana.com; 'local' = .deb file already present on the host."
  - key: alloy_local_package_path
    label: Local .deb path
    type: string
    default: ""
    help_text: Absolute path to the .deb on the target host. Only used when install method is 'local'.
  - key: alloy_config_only
    label: Config only (skip install)
    type: bool
    default: false
    help_text: Skip package install and only refresh /etc/alloy/conf.d/. Useful for config-only re-runs.
  - key: alloy_detect_services
    label: Auto-detect services
    type: bool
    default: true
    help_text: Detect Docker / MySQL / PostgreSQL via systemd + listening ports and deploy matching scrape configs.
