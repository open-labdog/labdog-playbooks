---
- name: Install and configure Grafana Alloy
  hosts: all
  become: true
  pre_tasks:
    - name: Refuse non-Debian-family hosts
      ansible.builtin.assert:
        that: ansible_os_family == "Debian"
        fail_msg: >-
          alloy-install supports Debian/Ubuntu hosts only. Detected
          os_family={{ ansible_os_family }}. RHEL-family / other
          distros are not yet supported by this pack.

  roles:
    # Detect whether Alloy is already installed and how it loads config.
    # Sets _alloy_mode (fresh | adopt_dir | adopt_file) plus the effective
    # config dir / filename prefix / reload-only facts everything else keys
    # off. Must run first.
    - role: role-alloy-linux-state

    # Add Grafana APT repository — only on a fresh install (skipped when
    # adopting an existing Alloy, or in config-only mode).
    - role: role-alloy-linux-repo
      when:
        - not alloy_config_only | default(false) | bool
        - _alloy_mode == 'fresh'

    # Install the Alloy package from the Grafana APT repository.
    - role: role-alloy-linux-install
      when:
        - not alloy_config_only | default(false) | bool
        - _alloy_mode == 'fresh'

    # Deploy base configs.
    - role: role-alloy-linux-configure

    # Detect running services / listening ports.
    - role: role-alloy-linux-detect
      when: alloy_detect_services | default(true) | bool

    # Deploy per-service config files (docker, mysql, postgresql, custom).
    - role: role-alloy-linux-services

    # Manage the alloy systemd service.
    - role: role-alloy-linux-service
