key: linux-upgrade
name: Upgrade Linux packages
description: >-
  Upgrades all system packages to the latest version.
  Reboots if /var/run/reboot-required is set.
icon: ArrowUpFromLine
playbook: playbook.yml
version: "1.0"
estimated_duration: "5–15 min"
destructive: true
supports_group: true
supports_host: true
# Floor for the main playbook's wall-clock budget. A real apt upgrade
# easily outruns LabDog's short global ansible.playbook_timeout default,
# which is what kills slow hosts mid-upgrade (and then rolls them back).
# Effective timeout is max(this, the global setting).
playbook_timeout_seconds: 1800
# Post-run verify: SSH ping, load / disk thresholds, no systemd units
# in 'failed' state. See ../../verify/README.md for the full template.
verify_playbook: ../../verify/post-upgrade.yml
verify_timeout_seconds: 180
parameters:
  - key: auto_reboot
    label: Reboot if required
    type: bool
    default: true
    help_text: Reboot the host after upgrade if /var/run/reboot-required exists.
  - key: reboot_timeout
    label: Reboot timeout (seconds)
    type: int
    default: 300
    help_text: Maximum seconds to wait for host to come back after reboot.
  - key: cleanup
    label: Remove unused packages
    type: bool
    default: true
  - key: ignore_failed_units
    label: Tolerated failed units
    type: string
    default: ""
    help_text: >-
      Comma-separated systemd unit names whose pre-existing 'failed' state
      should not fail verification (e.g. chronyd.service). Use full unit
      names. Leave blank to fail on any failed unit.
