---
- name: LabDog example — system probe
  hosts: all
  become: true

  vars:
    marker_dir: /var/lib/labdog-example
    fail_verify: false

  tasks:
    - name: Gather system facts
      ansible.builtin.setup:
        gather_subset:
          - hardware
          - network
          - virtual

    - name: Create marker directory
      ansible.builtin.file:
        path: "{{ marker_dir }}"
        state: directory
        mode: "0755"
        owner: root
        group: root

    - name: Write probe marker
      ansible.builtin.copy:
        dest: "{{ marker_dir }}/last-run"
        content: |
          run_at={{ ansible_date_time.iso8601 }}
          host={{ inventory_hostname }}
          os={{ ansible_distribution }} {{ ansible_distribution_version }}
          kernel={{ ansible_kernel }}
          arch={{ ansible_architecture }}
          total_mem_mb={{ (ansible_memtotal_mb | int) }}
          cpu_count={{ ansible_processor_vcpus }}
          fail_verify={{ fail_verify | bool }}
        mode: "0644"

    - name: Show probe summary
      ansible.builtin.debug:
        msg: >-
          Probe written to {{ marker_dir }}/last-run on {{ inventory_hostname }}
          ({{ ansible_distribution }} {{ ansible_distribution_version }},
          {{ ansible_processor_vcpus }} vCPU, {{ ansible_memtotal_mb }}MB RAM).
          fail_verify={{ fail_verify | bool }}.

    # Write a sentinel file when fail_verify is set. The verify playbook
    # detects this and asserts false, triggering rollback. This lets you
    # confirm that the snapshot + rollback pipeline is wired up correctly
    # without actually damaging anything on the host.
    - name: Write failure sentinel (fail_verify mode)
      ansible.builtin.copy:
        dest: "{{ marker_dir }}/fail-sentinel"
        content: |
          Intentional verify failure requested at {{ ansible_date_time.iso8601 }}.
          LabDog should roll this host back to its pre-run snapshot.
        mode: "0644"
      when: fail_verify | bool
